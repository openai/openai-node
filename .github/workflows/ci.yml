# Runs the repository's normal lint, build, test, benchmark, example, and ecosystem checks.
# These checks catch generated-code, packaging, runtime, and integration
# regressions; policy-document alignment lives in node-version-policy.yml.
name: CI
on:
  push:
    branches:
      - '**'
      - '!gh-readonly-queue/**'
      - '!integrated/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check formatting and lint rules
        run: ./scripts/lint

      - name: Check types
        run: pnpm exec tsc

  build:
    timeout-minutes: 5
    name: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check build
        run: ./scripts/build

      - name: Check published source types with TypeScript 4.9
        run: ./node_modules/typescript-4-9/bin/tsc --project dist/src/tsconfig.json --noEmit

      - name: Check published source types with TypeScript 6
        run: ./node_modules/typescript/bin/tsc --project dist/src/tsconfig.json --noEmit

      - name: Check package types
        run: |
          pnpm exec attw --pack dist -f json > .attw.json || true
          node scripts/utils/attw-report.cjs

      - name: Check published package
        run: pnpm exec publint dist

  node_matrix:
    name: Read Node.js test matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Read policy matrix
        id: policy
        run: echo "matrix=$(node --experimental-strip-types scripts/check-node-version-policy.ts --matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.node-version }})
    needs: node_matrix
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review'
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.node_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      # pnpm 11 requires Node >=22.13, so install dependencies with the current
      # LTS before switching to the runtime version under test.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Set up test Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '${{ matrix.node-version }}'

      - name: Run tests
        run: ./scripts/test

      - name: Test packed npm package
        if: matrix.experimental == false
        run: |
          ./scripts/build
          node --experimental-strip-types scripts/test-packed-package.ts

  test_matrix:
    name: ${{ (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review') && 'test matrix' || 'test matrix (not run)' }}
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review') }}
    needs: [test, benchmarks]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tests (all)
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Node.js test matrix result: $TEST_RESULT"
            exit 1
          fi
          if [ "$BENCHMARKS_RESULT" != "success" ]; then
            echo "::error::Performance benchmarks result: $BENCHMARKS_RESULT"
            exit 1
          fi

  benchmarks:
    timeout-minutes: 20
    name: performance benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork || github.event.action == 'ready_for_review'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run Vitest performance benchmarks
        run: pnpm bench:json

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30

  examples:
    timeout-minutes: 10
    name: examples
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == 'openai/openai-node' &&
        github.ref != 'refs/heads/release-please--branches--main--components--openai' &&
        github.head_ref != 'release-please--branches--main--components--openai'
      }}
    environment: ci
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run demo
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Skipping examples because OPENAI_API_KEY is not set"
            exit 0
          fi
          pnpm tsn examples/chat-completions/demo.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  ecosystem_tests:
    name: ecosystem tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{
        github.ref != 'refs/heads/release-please--branches--main--components--openai' &&
        github.head_ref != 'release-please--branches--main--components--openai'
      }}
    environment: ci
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v1.39.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run ecosystem tests without live credentials
        if: >-
          ${{
            github.actor == 'dependabot[bot]' ||
            (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository)
          }}
        run: |
          pnpm tsn ecosystem-tests/cli.ts --verbose --parallel --jobs=4 --retry=3
        env:
          DISABLE_V8_COMPILE_CACHE: '1'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run ecosystem tests with live credentials
        if: >-
          ${{
            github.actor != 'dependabot[bot]' &&
            (github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository)
          }}
        run: |
          pnpm tsn ecosystem-tests/cli.ts --live --verbose --parallel --jobs=4 --retry=3
        env:
          DISABLE_V8_COMPILE_CACHE: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          PUPPETEER_SKIP_DOWNLOAD: 'true'
