# Watches the default branch for release-please output and publishes newly
# created SDK releases.
name: Create releases
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

jobs:
  validate-release-version:
    name: validate release PR version
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'release-please--branches--main--components--openai' &&
        github.repository == 'openai/openai-node'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Compare the release title with the generated version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bash ./bin/check-release-version "${PR_TITLE}"

  release:
    name: release
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'openai/openai-node'
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Validate pending release PR versions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash ./bin/check-pending-release-versions

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publication-check:
    name: check publication state
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.repository == 'openai/openai-node'
      }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      release_sha: ${{ steps.check.outputs.release_sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether the current release needs publishing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_version="$(jq -r -e '.version' package.json)"
          release_tag="v${package_version}"

          set +e
          release_info="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>&1)"
          release_status=$?
          set -e
          if [[ ${release_status} -ne 0 ]]; then
            if grep -q 'HTTP 404' <<< "${release_info}"; then
              echo "No GitHub release exists for ${release_tag}; nothing to publish."
              echo 'should_publish=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Unable to check for GitHub release ${release_tag}:"
            echo "${release_info}"
            exit 1
          fi

          release_target="$(jq -r -e '.target_commitish' <<< "${release_info}")"
          if [[ ! "${release_target}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub release ${release_tag} does not identify an immutable commit: ${release_target}"
            exit 1
          fi

          release_sha="$(bash ./bin/resolve-tag-commit "${release_tag}")"
          if [[ "${release_sha}" != "${release_target}" ]]; then
            echo "Release tag ${release_tag} resolves to ${release_sha}, not release commit ${release_target}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${release_sha}" "${GITHUB_SHA}"; then
            echo "Release commit ${release_sha} is not reachable from protected main commit ${GITHUB_SHA}."
            exit 1
          fi

          release_package_version="$(git show "${release_sha}:package.json" | jq -r -e '.version')"
          if [[ "${release_package_version}" != "${package_version}" ]]; then
            echo "Release commit ${release_sha} contains version ${release_package_version}, expected ${package_version}."
            exit 1
          fi

          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

          set +e
          bash ./bin/check-npm-version
          version_status=$?
          set -e

          if [[ ${version_status} -eq 0 ]]; then
            echo 'should_publish=false' >> "${GITHUB_OUTPUT}"
          elif [[ ${version_status} -eq 1 ]]; then
            echo 'should_publish=true' >> "${GITHUB_OUTPUT}"
          else
            exit "${version_status}"
          fi

  release-ci:
    name: check release CI before publication
    if: needs.publication-check.outputs.should_publish == 'true'
    needs: publication-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read

    steps:
      - name: Wait for CI on the immutable release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.publication-check.outputs.release_sha }}
        run: |
          run_id=''
          for attempt in {1..30}; do
            run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push \
              -f head_sha="${RELEASE_SHA}" \
              -f per_page=100 \
              --jq '.workflow_runs | map(select(.head_branch == "main")) | first | .id // empty')"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "${run_id}" ]]; then
            echo "::error::No CI push workflow found for release commit ${RELEASE_SHA}."
            exit 1
          fi

          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          if [[ "${run_sha}" != "${RELEASE_SHA}" ]]; then
            echo "::error::CI run ${run_id} targets ${run_sha}, expected ${RELEASE_SHA}."
            exit 1
          fi

          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status

  browser-compatibility:
    name: check browser compatibility before publication
    if: needs.publication-check.outputs.should_publish == 'true'
    needs: publication-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.publication-check.outputs.release_sha }}
          persist-credentials: false

      - name: Verify release commit
        env:
          RELEASE_SHA: ${{ needs.publication-check.outputs.release_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack the immutable release artifact
        run: |
          pnpm build
          package_tarball="$(npm pack ./dist --ignore-scripts --silent --pack-destination "${RUNNER_TEMP}")"
          package_root="$(mktemp -d "${RUNNER_TEMP}/openai-browser-package.XXXXXX")"
          tar -xzf "${RUNNER_TEMP}/${package_tarball}" -C "${package_root}"
          echo "BROWSER_PACKAGE_ROOT=${package_root}/package" >> "${GITHUB_ENV}"

      - name: Check native-browser imports from the packed artifact
        run: |
          node --experimental-vm-modules --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, realpath } from 'node:fs/promises';
          import { join, sep } from 'node:path';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          import { SourceTextModule } from 'node:vm';

          const packageRoot = await realpath(process.env.BROWSER_PACKAGE_ROOT);
          const modules = new Map();

          async function load(url) {
            let module = modules.get(url.href);
            if (!module) {
              const path = await realpath(fileURLToPath(url));
              assert(path.startsWith(`${packageRoot}${sep}`), `Module escapes packed artifact: ${path}`);
              module = new SourceTextModule(await readFile(path, 'utf8'), { identifier: url.href });
              modules.set(url.href, module);
            }
            return module;
          }

          const entrypoint = await load(pathToFileURL(join(packageRoot, 'index.mjs')));
          await entrypoint.link((specifier, parent) => {
            assert(
              specifier.startsWith('./') || specifier.startsWith('../') || specifier.startsWith('/'),
              `Native browsers cannot resolve module specifier ${JSON.stringify(specifier)} from ${parent.identifier}`,
            );
            return load(new URL(specifier, parent.identifier));
          });

          console.log(`Native-browser entrypoint linked ${modules.size} packed modules.`);
          NODE

  build-package:
    name: build release package
    if: needs.publication-check.outputs.should_publish == 'true'
    needs: publication-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.publication-check.outputs.release_sha }}
          persist-credentials: false

      - name: Verify release commit
        env:
          RELEASE_SHA: ${{ needs.publication-check.outputs.release_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build release package
        run: |
          pnpm build

      - name: Upload release package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openai-release-${{ needs.publication-check.outputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    name: publish
    if: needs.publication-check.outputs.should_publish == 'true'
    needs:
      - publication-check
      - release-ci
      - browser-compatibility
      - build-package
    runs-on: ubuntu-latest
    concurrency:
      group: publish-npm-${{ needs.publication-check.outputs.release_sha }}
      cancel-in-progress: false
    environment: publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preserve workflow-version publisher
        run: |
          cp ./bin/publish-npm "${RUNNER_TEMP}/openai-publish-npm"
          chmod 500 "${RUNNER_TEMP}/openai-publish-npm"

      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.publication-check.outputs.release_sha }}
          persist-credentials: false

      - name: Verify release commit
        env:
          RELEASE_SHA: ${{ needs.publication-check.outputs.release_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Set up OIDC-capable npm
        run: npm install --global --ignore-scripts npm@11.6.2

      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact-id }}
          merge-multiple: true
          path: dist/
          digest-mismatch: error

      - name: Publish to NPM
        run: |
          bash "${RUNNER_TEMP}/openai-publish-npm"
