# Compares pull requests with their base revision to catch exported API breaks
# that ordinary unit tests can miss.
name: CI
on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      comparison_base:
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  detect_breaking_changes:
    runs-on: 'ubuntu-latest'
    name: detect-breaking-changes
    if: github.repository == 'openai/openai-node'
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ inputs.comparison_base || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      FETCH_DEPTH: 0
    steps:
      - name: Calculate fetch-depth
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          echo "FETCH_DEPTH=$((PR_COMMITS + 1))" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Keep the checkout shallow; fetch the exact comparison base below.
          fetch-depth: ${{ env.FETCH_DEPTH }}
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Fetch comparison base
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Reject untrusted detector tooling changes
        if: inputs.candidate_sha != ''
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # workflow_sha is runner-owned: trusted main for the bridge, the proposed
          # workflow merge for its readonly PR validation. Never supplied by a candidate.
          git fetch --no-tags --depth=1 origin "$TRUSTED_WORKFLOW_SHA"
          git diff --exit-code "$TRUSTED_WORKFLOW_SHA" HEAD -- \
            scripts node_modules ':(glob)**/node_modules/**' package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc .npmrc .pnpmfile.cjs \
            ':(top,glob)*.json' ':(top,glob)*.ts' ':(top,glob)*.mts' ':(top,glob)*.cts' \
            ':(top,glob)*.js' ':(top,glob)*.mjs' ':(top,glob)*.cjs' \
            ':(glob)**/package.json' ':(glob)**/.npmrc' ':(glob)**/.pnpmfile.*' \
            ':(glob)**/oxfmt.config.*' ':(glob)**/oxlint.config.*' ':(glob)**/tsconfig*.json'

      - name: Set up pnpm
        if: inputs.candidate_sha == ''
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node
        if: inputs.candidate_sha == ''
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version-file: '.nvmrc'
          # A trusted-main dispatch must not let candidate code populate main caches.
          cache: ${{ inputs.candidate_sha == '' && 'pnpm' || '' }}

      - name: Install dependencies
        if: inputs.candidate_sha == ''
        run: |
          ./scripts/bootstrap

      - name: Detect breaking changes
        if: inputs.candidate_sha == ''
        run: |
          # The detector discovers tests from the base revision, including removed resources.
          ./scripts/detect-breaking-changes "$BASE_SHA"

      - name: Run unchanged candidate checks without runner credentials
        if: inputs.candidate_sha != ''
        env:
          NODE_IMAGE: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
        run: |
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --tmpfs /tmp:rw,exec,mode=1777 \
            --env HOME=/tmp/home --env CI=true --env "BASE_SHA=$BASE_SHA" \
            "$NODE_IMAGE" bash -euo pipefail <<'CANDIDATE'
              mkdir -p "$HOME" /tmp/candidate
              cp -a /source/. /tmp/candidate/
              cd /tmp/candidate
              test "$(cat .nvmrc)" = 24
              export PATH="$HOME/.local/bin:$PATH"
              version=$(node -e 'const fs=require("fs"); const pm=JSON.parse(fs.readFileSync("package.json")).packageManager; if(!/^pnpm@[0-9]+\.[0-9]+\.[0-9]+$/.test(pm)) process.exit(1); process.stdout.write(pm);')
              npm install --global --prefix "$HOME/.local" "$version"
              ./scripts/bootstrap
              # Compatibility consumers come only from the authenticated target base.
              # Remove candidate extras, including ambient .ts/.d.ts module shims.
              rm -rf tests examples
              git archive "$BASE_SHA" tests examples | tar -x
              ./scripts/detect-breaking-changes "$BASE_SHA"
          CANDIDATE
